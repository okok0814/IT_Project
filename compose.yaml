name: fashion-search
services:
  setup:
    build:
      context: .
      dockerfile: deploy/setup.Dockerfile
    init: true
    restart: "no"
    volumes:
      - runtime-data:/data
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      IMAGE_DIR: /data/current/catalog/images
      METADATA_PATH: /data/current/catalog/styles.csv
      INDEX_PATH: /data/current/embeddings/index/fashionclip_image_embeddings_flat.index
      PRODUCT_IDS_PATH: /data/current/embeddings/product_ids.npy
      MODEL_CACHE: /models/cache
      MODEL_PATH: /data/current/model
      SEARCH_CACHE_SIZE: ${SEARCH_CACHE_SIZE:-256}
      SEARCH_CACHE_TTL_SECONDS: ${SEARCH_CACHE_TTL_SECONDS:-300}
    volumes:
      - runtime-data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  runtime-data:
