server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS is re-resolved if the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8000;
    client_max_body_size 11m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    error_page 413 = @upload_too_large;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location ~ ^/(api(/|$)|products/|dataset2/images/|health$|ready$) {
        proxy_pass $api$request_uri;
    }
    # GET loads the React page; POST/OPTIONS use the legacy API route.
    location ~ ^/search/(image|text)$ {
        error_page 418 = @legacy_api;
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        try_files $uri /index.html;
    }
    location @legacy_api {
        proxy_pass $api$request_uri;
    }
    location @upload_too_large {
        default_type application/json;
        return 413 '{"success":false,"data":null,"error":"Upload is too large. Maximum image size is 10 MiB."}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
